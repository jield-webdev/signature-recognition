services:
  api:
    build: .
    ports:
      - "${HOST_PORT:-8000}:8000"
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
